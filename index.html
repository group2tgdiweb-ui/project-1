<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>project for group2</title>
    <script src="tailwind.js"></script>
  </head>
  <body class="m-0 font-sans bg-slate-50">
    <header
      class="flex items-center justify-between shadow-sm bg-white md:px-10"
    >
      <div class="w-[180px] h-[90px]">
        <img
          src="logo.png"
          alt="logo of the healthcare "
          class="w-full h-full"
        />
      </div>

      <nav
        class="flex items-center gap-6 md:gap-10"
        aria-label="Main navigation"
      >
        <a
          href="#"
          class="text-sm font-semibold text-slate-700 transition hover:text-blue-600 md:text-base"
          >Home</a
        >
        <a
          href="#"
          class="text-sm font-semibold text-slate-700 transition hover:text-blue-600 md:text-base"
          >About us</a
        >
        <a
          href="#"
          class="text-sm font-semibold text-slate-700 transition hover:text-blue-600 md:text-base"
          >Services</a
        >
        <a
          href="#"
          class="text-sm font-semibold text-slate-700 transition hover:text-blue-600 md:text-base"
          >Doctors</a
        >
      </nav>
    </header>
    <main>
      <section class="relative h-[500px] overflow-hidden">
        <div
          class="absolute inset-0 bg-cover bg-center"
          style="background-image: url(&quot;bg.png&quot;)"
        ></div>
        <div class="absolute inset-0 bg-slate-900/45"></div>

        <div class="relative z-10 flex h-full items-center px-6 md:px-16">
          <div class="max-w-xl text-white">
            <h1 class="text-4xl font-bold leading-tight md:text-5xl">
              Healthcare that comes to you
            </h1>
            <p class="mt-4 text-base text-slate-200 md:text-lg">
              Speak with qualified healthcare professionals from the comfort of
              your home.
            </p>
            <div class="mt-8 flex gap-4">
              <button
                class="bg-[#1E3A8A] px-6 py-3 text-sm font-semibold text-white shadow-lg transition hover:bg-blue-800"
              >
                Find a doctor
              </button>
              <button
                class="border bg-white/30 px-6 py-3 text-sm font-semibold text-blue transition hover:bg-#FFFFFF/20"
              >
                Learn More
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
